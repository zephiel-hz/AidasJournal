<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="#1a1a2e"/>
  
  <!-- Outer ring -->
  <circle cx="90" cy="90" r="84" fill="none" stroke="#d946a6" stroke-width="2" opacity="0.3"/>
  
  <!-- Book/Journal -->
  <g transform="translate(90, 90)">
    <!-- Left page -->
    <path d="M -35 -40 L -35 40 L -5 40 L -5 -40 Z" fill="none" stroke="#d946a6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right page -->
    <path d="M 5 -40 L 5 40 L 35 40 L 35 -40 Z" fill="none" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Spine -->
    <line x1="-5" y1="-40" x2="-5" y2="40" stroke="#d946a6" stroke-width="2"/>
    <line x1="5" y1="-40" x2="5" y2="40" stroke="#ec4899" stroke-width="2"/>
    
    <!-- Text lines on left -->
    <line x1="-28" y1="-25" x2="-12" y2="-25" stroke="#d946a6" stroke-width="1.5" opacity="0.7"/>
    <line x1="-28" y1="-15" x2="-10" y2="-15" stroke="#d946a6" stroke-width="1.5" opacity="0.6"/>
    <line x1="-28" y1="-5" x2="-15" y2="-5" stroke="#d946a6" stroke-width="1.5" opacity="0.5"/>
    <line x1="-28" y1="10" x2="-10" y2="10" stroke="#d946a6" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Text lines on right -->
    <line x1="12" y1="-25" x2="28" y2="-25" stroke="#ec4899" stroke-width="1.5" opacity="0.7"/>
    <line x1="10" y1="-15" x2="28" y2="-15" stroke="#ec4899" stroke-width="1.5" opacity="0.6"/>
    <line x1="15" y1="-5" x2="28" y2="-5" stroke="#ec4899" stroke-width="1.5" opacity="0.5"/>
    <line x1="10" y1="10" x2="28" y2="10" stroke="#ec4899" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Decorative hearts -->
    <g opacity="0.6">
      <path d="M -45 -50 Q -50 -53 -53 -50 Q -55 -47 -53 -43 L -48 -38 Q -45 -40 -42 -38 L -47 -43 Q -50 -47 -45 -50" fill="#d946a6"/>
    </g>
    
    <g opacity="0.6">
      <path d="M 45 -50 Q 50 -53 53 -50 Q 55 -47 53 -43 L 48 -38 Q 45 -40 42 -38 L 47 -43 Q 50 -47 45 -50" fill="#ec4899"/>
    </g>
  </g>
</svg>
